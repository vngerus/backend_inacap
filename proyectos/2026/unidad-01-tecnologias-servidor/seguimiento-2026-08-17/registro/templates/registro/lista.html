<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Michis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .gato-item { background: #f4f4f9; margin: 10px 0; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Registro MVT: Michis</h1>
    
    <div>
        {% for gato in gatos %}
            <div class="gato-item">
                <strong>{{ gato.nombre }}</strong> - Tipo: {{ gato.tipo }}
            </div>
        {% empty %}
            <p>No hay gatitos registrados todavía.</p>
        {% endfor %}
    </div>
</body>
</html>
